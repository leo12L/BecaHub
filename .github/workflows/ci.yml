name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: becahub_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/becahub_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/becahub_test
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key-for-ci-only
      NODE_ENV: test
      TZ: UTC

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create shadow database for migration validation
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d becahub_test -c "CREATE DATABASE becahub_shadow;"

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Validate migrations match schema
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/becahub_shadow
        run: |
          echo "Verificando que las migraciones coincidan con el schema..."
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code
          echo "✅ Migraciones validadas correctamente"

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run linter
        run: npm run lint

      - name: Run Vitest tests
        run: npm test

      - name: Build project
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: becahub_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/becahub_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/becahub_test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/becahub_shadow
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key-for-ci-only
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Seed screenshots test data
        continue-on-error: true
        run: npx tsx scripts/seed-screenshots-data.ts

      - name: Capture visual screenshots
        continue-on-error: true
        timeout-minutes: 8
        env:
          SCREENSHOTS: "1"
        run: |
          mkdir -p screenshots
          fuser -k 3000/tcp || true
          npx playwright test e2e/screenshots.spec.ts --reporter=list

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-pr
          path: screenshots/
          retention-days: 30

      - name: Install wait-on
        continue-on-error: true
        run: npm install -g wait-on

      - name: Run Lighthouse audit
        continue-on-error: true
        timeout-minutes: 8
        run: |
          fuser -k 3000/tcp || true
          mkdir -p lighthouse-results
          npm run build
          npm run start > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          npx wait-on http://localhost:3000 --timeout 30000 || (echo "Server failed to start:"; cat /tmp/server.log; exit 1)
          npx lighthouse http://localhost:3000/ \
            --preset=mobile \
            --only-categories=performance,accessibility \
            --output=json,html \
            --output-path=./lighthouse-results/lighthouse-mobile \
            --chrome-flags="--headless=new --no-sandbox --disable-gpu"
          kill $SERVER_PID || true

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: lighthouse-results/
          retention-days: 30
